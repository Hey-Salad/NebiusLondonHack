[project]
name = "salad-scout"
version = "1.0.0"
description = "HeySalad food intelligence on Tavily + Nebius Token Factory + Nebius AI Cloud"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "boto3>=1.34",
]

# Vercel loads `app` from app/main.py as the Vercel Function handler.
# Spelling it out keeps the package-relative imports in app/ working.
[tool.vercel]
entrypoint = "app.main:app"
