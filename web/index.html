<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salad Scout — HeySalad food intelligence</title>
<link rel="icon" href="https://raw.githubusercontent.com/Hey-Salad/.github/main/Sal.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --cherry: #ed4c4c;
    --red: #fe6c60;
    --peach: #faa09a;
    --peach-light: #ffd0cd;
    --ink: #000000;
    --ink-soft: #5c5250;
    --ink-faint: #8b807e;
    --paper: #ffffff;
    --line: rgba(0, 0, 0, 0.08);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(237, 76, 76, .06);
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Figtree', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    background-image: radial-gradient(120% 60% at 50% -10%, var(--peach-light) 0%, rgba(255,208,205,0) 62%);
    background-repeat: no-repeat;
    min-height: 100vh;
    line-height: 1.55;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; }

  /* ---- header ---- */
  header { padding-block: 18px 6px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { height: 26px; display: block; }
  .brand b {
    font-family: 'Grandstander', cursive; font-weight: 900; font-size: 15px;
    color: var(--cherry); letter-spacing: -.01em; white-space: nowrap;
  }
  .status { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 11.5px; font-weight: 500; color: var(--ink-faint);
    padding: 5px 10px; border-radius: 50px; background: rgba(255,255,255,.7);
    border: 1px solid var(--line);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--peach); flex: none; }
  @media (max-width: 560px) {
    .pill { font-size: 10px; padding: 4px 8px; gap: 4px; }
    header .wrap { gap: 8px; }
  }
  .dot.on { background: #2aa966; }
  .dot.off { background: var(--cherry); }

  /* ---- hero ---- */
  .hero { text-align: center; padding-block: 26px 22px; }
  .hero h1 {
    font-family: 'Grandstander', cursive; font-weight: 900;
    font-size: clamp(27px, 4.6vw, 42px); line-height: 1.12;
    margin: 0 auto 10px; max-width: 21ch; letter-spacing: -.02em;
  }
  .hero h1 em { font-style: normal; color: var(--cherry); }
  .hero p { margin: 0 auto; max-width: 48ch; color: var(--ink-soft); font-size: 15.5px; }

  /* ---- search ---- */
  .searchbar {
    display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 20px;
    background: var(--paper); border: 2px solid var(--peach-light);
    border-radius: 50px; box-shadow: var(--shadow); transition: border-color .15s;
  }
  .searchbar:focus-within { border-color: var(--cherry); }
  .searchbar input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--ink); padding: 11px 0;
  }
  .searchbar input::placeholder { color: var(--ink-faint); }
  .go {
    flex: none; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
    background: var(--cherry); color: #fff; border: 0; border-radius: 50px;
    padding: 12px 24px; transition: background .15s, transform .1s;
  }
  .go:hover:not(:disabled) { background: var(--red); }
  .go:active:not(:disabled) { transform: scale(.98); }
  .go:disabled { background: var(--peach); cursor: default; }

  .controls {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-top: 12px; padding-inline: 4px;
  }
  .controls select {
    font: inherit; font-size: 12.5px; color: var(--ink-soft); cursor: pointer;
    background: rgba(255,255,255,.75); border: 1px solid var(--line);
    border-radius: 50px; padding: 6px 26px 6px 12px; outline: 0;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%238b807e' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 11px center;
    max-width: 190px; text-overflow: ellipsis;
  }
  .controls select:hover, .controls select:focus { border-color: var(--peach); color: var(--ink); }
  .controls .sep { width: 1px; height: 16px; background: var(--line); margin-inline: 4px; }

  .examples { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; padding: 2px 4px 4px; scrollbar-width: none; }
  .examples::-webkit-scrollbar { display: none; }
  .examples button {
    flex: none; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    color: var(--ink-soft); background: transparent; border: 1px dashed var(--peach);
    border-radius: 50px; padding: 6px 13px; transition: .15s;
  }
  .examples button:hover { background: var(--peach-light); border-style: solid; color: var(--cherry); }

  /* ---- pipeline ---- */
  .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 26px; }
  @media (max-width: 720px) { .pipeline { grid-template-columns: 1fr 1fr; } }
  .step {
    position: relative; padding: 11px 13px; border-radius: 14px;
    background: rgba(255,255,255,.7); border: 1px solid var(--line);
    transition: border-color .2s, background .2s;
  }
  .step.active { border-color: var(--peach); background: #fff; }
  .step.done { background: #fff; }
  .step .top { display: flex; align-items: center; gap: 7px; }
  .step .mark {
    width: 15px; height: 15px; flex: none; border-radius: 50%;
    border: 1.5px solid var(--peach-light); display: grid; place-items: center;
  }
  .step.done .mark { background: var(--cherry); border-color: var(--cherry); }
  .step.done .mark::after { content: '✓'; color: #fff; font-size: 9px; line-height: 1; }
  .step.warn .mark { background: var(--peach); border-color: var(--peach); }
  .step.warn .mark::after { content: '!'; color: #fff; font-size: 9px; font-weight: 700; line-height: 1; }
  .step .name { font-size: 12.5px; font-weight: 600; letter-spacing: -.01em; }
  .step .sub {
    font-size: 11px; color: var(--ink-faint); margin-top: 3px; padding-left: 22px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 15px;
  }
  .spin {
    width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--peach-light);
    border-top-color: var(--cherry); animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- results ---- */
  .results { display: grid; grid-template-columns: minmax(0,1.75fr) minmax(0,1fr); gap: 20px; margin-top: 20px; align-items: start; }
  @media (max-width: 860px) { .results { grid-template-columns: 1fr; } }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .brief { padding: clamp(20px, 3vw, 30px); animation: rise .3s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .brief h2 {
    font-family: 'Grandstander', cursive; font-weight: 700; font-size: 17px; color: var(--cherry);
    margin: 26px 0 8px; letter-spacing: -.01em;
  }
  .brief h2:first-child { margin-top: 0; }
  .brief p { margin: 0 0 12px; max-width: 68ch; }
  .brief ul { margin: 0 0 14px; padding-left: 18px; max-width: 68ch; }
  .brief li { margin-bottom: 7px; }
  .brief li::marker { color: var(--peach); }
  .cite {
    display: inline-block; font-size: 10.5px; font-weight: 600; text-decoration: none;
    padding: 1px 6px; margin-left: 2px; border-radius: 50px; vertical-align: 1px;
    background: var(--peach-light); color: var(--cherry);
  }
  .cite:hover { background: var(--cherry); color: #fff; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--cherry); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .skeleton span {
    display: block; height: 11px; border-radius: 6px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--peach-light) 25%, #fff5f4 50%, var(--peach-light) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-faint);
  }
  .meta .copy {
    margin-left: auto; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    color: var(--cherry); background: transparent; border: 1px solid var(--peach-light);
    border-radius: 50px; padding: 5px 13px;
  }
  .meta .copy:hover { background: var(--peach-light); }

  .sources { position: sticky; top: 16px; }
  .sources h3 {
    font-family: 'Grandstander', cursive; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-faint); margin: 0 0 10px; padding-left: 2px;
  }
  .source {
    display: block; text-decoration: none; color: inherit; padding: 12px 14px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--paper);
    margin-bottom: 8px; transition: border-color .15s, transform .15s;
  }
  .source:hover { border-color: var(--peach); transform: translateX(-2px); }
  .source .hd { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .source .n {
    width: 17px; height: 17px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--peach-light); color: var(--cherry); font-size: 10px; font-weight: 700;
  }
  .source .date { font-size: 10.5px; color: var(--ink-faint); }
  .source .t { font-size: 13px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
  .source .d { font-size: 11px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 3px; border-radius: 3px; background: var(--peach-light); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--cherry); border-radius: 3px; }

  .note { padding: 13px 16px; border-radius: 14px; background: var(--peach-light); font-size: 13px; margin-top: 16px; }
  .note a { color: var(--cherry); font-weight: 600; word-break: break-all; }
  .note.bad { background: #fff1f0; border: 1px solid var(--peach); }
  .note.bad b { color: var(--cherry); }
  [hidden] { display: none !important; }
  footer { text-align: center; padding-block: 34px 44px; font-size: 12px; color: var(--ink-faint); }
  footer a { color: var(--cherry); text-decoration: none; }
</style>
</head>
<body>

<header><div class="wrap">
  <div class="brand">
    <img src="https://raw.githubusercontent.com/Hey-Salad/.github/main/HeySalad%20Logo%20Black.svg" alt="HeySalad" />
    <b>Salad Scout</b>
  </div>
  <div class="status" id="status"></div>
</div></header>

<main class="wrap">
  <div class="hero">
    <h1>Ask the web. Get a <em>briefing you can trust</em>.</h1>
    <p>Live sources from Tavily, ranked and written up by Nebius Token Factory, filed to Nebius AI Cloud.</p>
  </div>

  <form id="form">
    <div class="searchbar">
      <input id="query" type="text" autocomplete="off" required
             placeholder="What do you want to know about food, menus or markets?" />
      <button class="go" id="goBtn" type="submit">Scout it</button>
    </div>

    <div class="controls">
      <select id="topic" aria-label="Search topic">
        <option value="general">General web</option>
        <option value="news">News</option>
      </select>
      <select id="time_range" aria-label="Freshness">
        <option value="">Any time</option>
        <option value="week">Past week</option>
        <option value="month">Past month</option>
        <option value="year">Past year</option>
      </select>
      <select id="max_results" aria-label="Sources to read">
        <option value="6">6 sources</option>
        <option value="8" selected>8 sources</option>
        <option value="12">12 sources</option>
        <option value="16">16 sources</option>
      </select>
      <span class="sep"></span>
      <select id="model" aria-label="Token Factory model">
        <option value="">Model: account default</option>
      </select>
    </div>

    <div class="examples" id="examples"></div>
  </form>

  <section class="pipeline" id="pipeline" hidden></section>
  <div class="note bad" id="error" hidden></div>

  <section class="results" id="results" hidden>
    <article class="card brief" id="brief"></article>
    <aside class="sources" id="sources"></aside>
  </section>
</main>

<footer>
  <strong>HeySalad®</strong> — love your food · Nebius London Hack · <a href="/docs">API</a>
</footer>

<script>
const STEPS = [
  { id: 'search',  name: 'Tavily',      hint: 'searching the web' },
  { id: 'rank',    name: 'Embeddings',  hint: 'ranking sources' },
  { id: 'brief',   name: 'Briefing',    hint: 'writing with citations' },
  { id: 'archive', name: 'AI Cloud',    hint: 'archiving' }
];
const EXAMPLES = [
  'What is driving harissa demand in UK retail?',
  'How are London restaurants cutting food waste?',
  'Which plant-based protein startups raised money this year?',
  'What allergen labelling rules changed for UK food businesses?'
];

const $ = (id) => document.getElementById(id);
let sources = [];
let raw = '';
let meta = {};

const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function renderPipeline() {
  $('pipeline').innerHTML = STEPS.map((s) => `
    <div class="step" id="step-${s.id}">
      <div class="top"><span class="mark" id="mark-${s.id}"></span><span class="name">${s.name}</span></div>
      <div class="sub" id="sub-${s.id}">${s.hint}</div>
    </div>`).join('');
}

function setStep(id, status, detail) {
  const step = $(`step-${id}`);
  if (!step) return;
  step.className = 'step' + (status === 'running' ? ' active' : status === 'done' ? ' done'
    : status === 'warn' ? ' done warn' : '');
  $(`mark-${id}`).innerHTML = status === 'running' ? '<span class="spin"></span>' : '';
  if (detail) $(`sub-${id}`).textContent = detail;
  else if (status === 'skipped') $(`sub-${id}`).textContent = 'skipped';
}

// Small markdown subset: ## headings, bullets, **bold**, [n] citations.
function renderMarkdown(text) {
  const lines = esc(text).split('\n');
  let html = '', inList = false;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('## ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h2>${t.slice(3)}</h2>`;
    } else if (t.startsWith('- ') || t.startsWith('* ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${t.slice(2)}</li>`;
    } else if (t) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p>${t}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+)\]/g, (m, n) => {
      const s = sources[Number(n) - 1];
      return s ? `<a class="cite" href="${s.url}" target="_blank" rel="noopener" title="${esc(s.title)}">${n}</a>` : m;
    });
}

function paintBrief(streaming) {
  const body = renderMarkdown(raw) + (streaming ? '<span class="cursor"></span>' : '');
  if (streaming) { $('brief').innerHTML = body; return; }
  $('brief').innerHTML = body + `
    <div class="meta">
      <span>${esc(meta.model || '')}</span>
      ${meta.tokens ? `<span>· ${meta.tokens} tokens</span>` : ''}
      ${meta.ms ? `<span>· ${(meta.ms / 1000).toFixed(1)}s</span>` : ''}
      <button class="copy" id="copyBtn" type="button">Copy briefing</button>
    </div>` + (meta.archived ? `<div class="note">Filed to Nebius AI Cloud —
      <a href="${meta.archived.url}" target="_blank" rel="noopener">${esc(meta.archived.key)}</a></div>` : '');
  const copy = $('copyBtn');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(raw); copy.textContent = 'Copied'; }
    catch (e) { copy.textContent = 'Copy failed'; }
    setTimeout(() => { copy.textContent = 'Copy briefing'; }, 1600);
  };
}

function renderSources() {
  // Cosine scores bunch up high, so scale each bar against the best one.
  const top = Math.max(...sources.map((s) => s.relevance || 0), 0.0001);
  $('sources').innerHTML = '<h3>Sources</h3>' + sources.map((s, i) => `
    <a class="source" href="${s.url}" target="_blank" rel="noopener">
      <div class="hd">
        <span class="n">${i + 1}</span>
        ${s.published_date ? `<span class="date">${esc(s.published_date.slice(0, 10))}</span>` : ''}
      </div>
      <div class="t">${esc(s.title)}</div>
      <div class="d">${esc((s.url || '').replace(/^https?:\/\/(www\.)?/, '').split('/')[0])}</div>
      ${s.relevance !== undefined ? `<div class="bar" title="relevance ${s.relevance}">
        <i style="width:${Math.max(6, Math.round((s.relevance / top) * 100))}%"></i></div>` : ''}
    </a>`).join('');
}

function fail(message) {
  $('error').innerHTML = `<b>Something went wrong.</b> ${esc(message)}`;
  $('error').hidden = false;
}

async function loadHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    $('status').innerHTML = [['Tavily', h.tavily], ['Token Factory', h.token_factory], ['AI Cloud', h.object_storage]]
      .map(([n, on]) => `<span class="pill"><span class="dot ${on ? 'on' : 'off'}"></span>${n}</span>`).join('');
    if (h.missing) fail(`Add ${h.missing} to your .env (run ./setkeys.sh), then restart the server.`);
  } catch (e) { /* cosmetic */ }
  try {
    const m = await (await fetch('/api/models')).json();
    for (const id of (m.chat_models || [])) {
      $('model').insertAdjacentHTML('beforeend', `<option value="${id}">${id.split('/').pop()}</option>`);
    }
  } catch (e) { /* falls back to account default */ }
}

async function scout(event) {
  event.preventDefault();
  const query = $('query').value.trim();
  if (!query) return;

  sources = []; raw = ''; meta = {};
  $('goBtn').disabled = true;
  $('goBtn').textContent = 'Scouting…';
  $('error').hidden = true;
  $('pipeline').hidden = false;
  $('results').hidden = false;
  $('sources').innerHTML = '';
  $('brief').innerHTML = '<div class="skeleton"><span style="width:82%"></span><span style="width:95%"></span><span style="width:70%"></span></div>';
  renderPipeline();
  $('pipeline').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  try {
    const response = await fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query, topic: $('topic').value, time_range: $('time_range').value,
        max_results: Number($('max_results').value), model: $('model').value
      })
    });
    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || `Request failed (${response.status})`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        const evt = (frame.match(/^event: (.*)$/m) || [])[1];
        const line = (frame.match(/^data: (.*)$/m) || [])[1];
        if (!evt || !line) continue;
        const data = JSON.parse(line);

        if (evt === 'stage') setStep(data.id, data.status, data.detail);
        else if (evt === 'sources') { sources = data.sources; renderSources(); }
        else if (evt === 'delta') { raw += data.text; paintBrief(true); }
        else if (evt === 'done') {
          meta = { model: data.model, tokens: (data.usage || {}).total_tokens, ms: data.ms, archived: data.archived };
          paintBrief(false);
        } else if (evt === 'error') { fail(data.message); paintBrief(false); }
      }
    }
    if (raw && !meta.model) paintBrief(false);
  } catch (err) {
    fail(err.message);
    paintBrief(false);
  } finally {
    $('goBtn').disabled = false;
    $('goBtn').textContent = 'Scout it';
  }
}

$('examples').innerHTML = EXAMPLES.map((e) => `<button type="button">${e}</button>`).join('');
$('examples').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') { $('query').value = e.target.textContent; $('query').focus(); }
});
$('form').addEventListener('submit', scout);
loadHealth();
</script>
</body>
</html>
