<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Salad Scout — HeySalad food intelligence</title>
<link rel="icon" href="https://raw.githubusercontent.com/Hey-Salad/.github/main/Sal.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Figtree:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --hs-cherry: #ed4c4c;
    --hs-red: #fe6c60;
    --hs-dark-peach: #faa09a;
    --hs-light-peach: #ffd0cd;
    --hs-black: #000000;
    --hs-white: #ffffff;
    --ink-soft: #4a4a4a;
    --line: rgba(0, 0, 0, 0.1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Figtree', system-ui, -apple-system, sans-serif;
    color: var(--hs-black);
    background: linear-gradient(180deg, var(--hs-light-peach) 0%, #fff7f6 42%, var(--hs-white) 100%);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px clamp(16px, 4vw, 48px); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { height: 34px; }
  .brand span {
    font-family: 'Grandstander', cursive; font-weight: 900; font-size: 18px;
    color: var(--hs-cherry); letter-spacing: -0.02em;
  }
  .status { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 50px;
    background: var(--hs-white); border: 1px solid var(--line); color: var(--ink-soft);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hs-dark-peach); }
  .dot.on { background: #2aa966; }
  .dot.off { background: var(--hs-cherry); }

  main { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) 64px; }
  .hero { text-align: center; padding: 8px 0 28px; }
  .hero h1 {
    font-family: 'Grandstander', cursive; font-weight: 900;
    font-size: clamp(32px, 6vw, 56px); line-height: 1.05; margin: 0 0 12px;
  }
  .hero h1 em { font-style: normal; color: var(--hs-cherry); }
  .hero p { margin: 0 auto; max-width: 620px; font-size: 17px; color: var(--ink-soft); }

  .card {
    background: var(--hs-white); border: 1px solid var(--line);
    border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(237, 76, 76, 0.07);
  }
  form.search { display: grid; gap: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 160px; }
  input[type=text], select {
    width: 100%; font-family: inherit; font-size: 16px; padding: 14px 18px;
    border: 2px solid var(--hs-light-peach); border-radius: 50px; background: var(--hs-white);
    color: var(--hs-black); outline: none;
  }
  input[type=text]:focus, select:focus { border-color: var(--hs-cherry); }
  label.field { display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  label.field span { padding-left: 14px; }
  button.cta {
    font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 16px;
    background: var(--hs-cherry); color: var(--hs-white); border: none;
    border-radius: 50px; padding: 15px 34px; cursor: pointer; transition: background .15s ease;
  }
  button.cta:hover:not(:disabled) { background: var(--hs-red); }
  button.cta:disabled { background: var(--hs-dark-peach); cursor: not-allowed; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 13px; padding: 8px 14px; border-radius: 50px; cursor: pointer;
    background: transparent; border: 2px solid var(--hs-light-peach); color: var(--ink-soft);
    font-family: inherit;
  }
  .chip:hover { border-color: var(--hs-cherry); color: var(--hs-cherry); }

  .pipeline { display: grid; gap: 10px; margin-top: 22px; }
  .step {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-radius: 16px; background: var(--hs-white); border: 1px solid var(--line);
    font-size: 14px; opacity: .55; transition: opacity .2s ease, border-color .2s ease;
  }
  .step.active { opacity: 1; border-color: var(--hs-dark-peach); }
  .step.done { opacity: 1; }
  .step .idx {
    width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--hs-light-peach); color: var(--hs-cherry); font-weight: 600; font-size: 12px;
  }
  .step.done .idx { background: var(--hs-cherry); color: var(--hs-white); }
  .step.warn .idx { background: var(--hs-dark-peach); color: var(--hs-black); }
  .step b { font-weight: 600; }
  .step .detail { margin-left: auto; font-size: 12px; color: var(--ink-soft); text-align: right; }
  .spin {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--hs-light-peach); border-top-color: var(--hs-cherry);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; margin-top: 22px; align-items: start; }
  @media (max-width: 900px) { .results { grid-template-columns: 1fr; } }
  .brief h2 {
    font-family: 'Grandstander', cursive; font-weight: 700; font-size: 20px;
    margin: 22px 0 10px; color: var(--hs-cherry);
  }
  .brief h2:first-child { margin-top: 0; }
  .brief p, .brief li { line-height: 1.65; font-size: 15px; }
  .brief ul { padding-left: 20px; margin: 10px 0; }
  .brief li { margin-bottom: 8px; }
  .cite {
    display: inline-block; min-width: 20px; text-align: center; font-size: 11px; font-weight: 600;
    padding: 1px 7px; margin: 0 2px; border-radius: 50px; text-decoration: none;
    background: var(--hs-light-peach); color: var(--hs-cherry);
  }
  .cite:hover { background: var(--hs-cherry); color: var(--hs-white); }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--hs-cherry); animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.1%,100% { opacity: 0 } }

  .sources h3 {
    font-family: 'Grandstander', cursive; font-size: 16px; margin: 0 0 12px;
  }
  .source {
    display: block; text-decoration: none; color: inherit; padding: 12px 14px;
    border-radius: 14px; border: 1px solid var(--line); margin-bottom: 10px; background: var(--hs-white);
  }
  .source:hover { border-color: var(--hs-cherry); }
  .source .n { color: var(--hs-cherry); font-weight: 600; font-size: 12px; }
  .source .t { font-weight: 600; font-size: 14px; margin: 2px 0 4px; line-height: 1.35; }
  .source .m { font-size: 11px; color: var(--ink-soft); word-break: break-all; }
  .scorebar { height: 4px; border-radius: 4px; background: var(--hs-light-peach); margin-top: 8px; overflow: hidden; }
  .scorebar i { display: block; height: 100%; background: var(--hs-cherry); }

  .notice { padding: 14px 18px; border-radius: 16px; background: var(--hs-light-peach); font-size: 14px; margin-top: 18px; }
  .notice.error { background: #ffe3e1; border: 1px solid var(--hs-cherry); }
  .hidden { display: none; }
  footer { text-align: center; padding: 28px 16px 48px; font-size: 13px; color: var(--ink-soft); }
  footer a { color: var(--hs-cherry); text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="https://raw.githubusercontent.com/Hey-Salad/.github/main/HeySalad%20Logo%20Black.svg" alt="HeySalad" />
    <span>Salad Scout</span>
  </div>
  <div class="status" id="status"></div>
</header>

<main>
  <section class="hero">
    <h1>Ask the web. Get a <em>briefing you can trust</em>.</h1>
    <p>Salad Scout searches live sources with Tavily, ranks and writes them up with Nebius Token Factory, and files every briefing to Nebius AI Cloud.</p>
  </section>

  <section class="card">
    <form class="search" id="form">
      <input type="text" id="query" placeholder="What do you want to know about food, menus or markets?" autocomplete="off" required />
      <div class="row">
        <label class="field"><span>Search topic</span>
          <select id="topic">
            <option value="general">General</option>
            <option value="news">News</option>
          </select>
        </label>
        <label class="field"><span>Freshness</span>
          <select id="time_range">
            <option value="">Any time</option>
            <option value="week">Past week</option>
            <option value="month">Past month</option>
            <option value="year">Past year</option>
          </select>
        </label>
        <label class="field"><span>Sources to read</span>
          <select id="max_results">
            <option value="6">6</option>
            <option value="8" selected>8</option>
            <option value="12">12</option>
            <option value="16">16</option>
          </select>
        </label>
        <label class="field"><span>Token Factory model</span>
          <select id="model"><option value="">Account default</option></select>
        </label>
      </div>
      <div class="examples" id="examples"></div>
      <div><button class="cta" id="go" type="submit">Scout it</button></div>
    </form>

    <div class="pipeline" id="pipeline"></div>
  </section>

  <div class="notice error hidden" id="error"></div>

  <section class="results hidden" id="results">
    <article class="card brief" id="brief"></article>
    <aside class="sources" id="sources"></aside>
  </section>
</main>

<footer>
  <strong>HeySalad®</strong> — love your food · Built for the Nebius London Hack ·
  <a href="/docs">API docs</a>
</footer>

<script>
const STEPS = [
  { id: 'search',  label: 'Tavily search',            hint: 'live web sources' },
  { id: 'rank',    label: 'Token Factory embeddings', hint: 'semantic rerank' },
  { id: 'brief',   label: 'Token Factory chat',       hint: 'cited briefing' },
  { id: 'archive', label: 'Nebius AI Cloud',          hint: 'Object Storage archive' }
];

const EXAMPLES = [
  'What is driving harissa demand in UK retail right now?',
  'How are London restaurants cutting food waste in 2026?',
  'Which plant-based protein startups raised funding this year?',
  'What allergen labelling rules changed for UK food businesses?'
];

const $ = (id) => document.getElementById(id);
let sources = [];
let raw = '';

function renderPipeline() {
  $('pipeline').innerHTML = STEPS.map((s, i) => `
    <div class="step" id="step-${s.id}">
      <div class="idx">${i + 1}</div>
      <div><b>${s.label}</b> <span style="color:var(--ink-soft);font-size:13px"> · ${s.hint}</span></div>
      <div class="detail" id="detail-${s.id}"></div>
    </div>`).join('');
}

function setStep(id, status, detail) {
  const el = $(`step-${id}`);
  if (!el) return;
  el.className = 'step ' + (status === 'running' ? 'active' : status === 'done' ? 'done' : status === 'warn' ? 'done warn' : '');
  const box = $(`detail-${id}`);
  if (status === 'running') box.innerHTML = '<div class="spin"></div>';
  else box.textContent = detail || (status === 'skipped' ? 'skipped' : '');
}

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Small markdown subset: ## headings, - bullets, **bold**, [n] citations.
function renderMarkdown(text) {
  const lines = escapeHtml(text).split('\n');
  let html = '', inList = false;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('## ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h2>${t.slice(3)}</h2>`;
    } else if (t.startsWith('- ') || t.startsWith('* ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${t.slice(2)}</li>`;
    } else if (t) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p>${t}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+)\]/g, (m, n) => {
      const src = sources[Number(n) - 1];
      return src
        ? `<a class="cite" href="${src.url}" target="_blank" rel="noopener" title="${escapeHtml(src.title)}">${n}</a>`
        : m;
    });
}

function renderSources() {
  // Cosine scores cluster high (0.6-0.95), so show each bar relative to the
  // best-scoring source - that makes the ranking readable instead of all-full.
  const top = Math.max(...sources.map((s) => s.relevance || 0), 0.0001);
  $('sources').innerHTML = '<h3>Sources</h3>' + sources.map((s, i) => `
    <a class="source" href="${s.url}" target="_blank" rel="noopener">
      <div class="n">[${i + 1}]${s.published_date ? ' · ' + s.published_date.slice(0, 10) : ''}</div>
      <div class="t">${escapeHtml(s.title)}</div>
      <div class="m">${escapeHtml((s.url || '').replace(/^https?:\/\//, '').slice(0, 64))}</div>
      ${s.relevance !== undefined
        ? `<div class="scorebar" title="relevance ${s.relevance}"><i style="width:${Math.max(6, Math.round((s.relevance / top) * 100))}%"></i></div>`
        : ''}
    </a>`).join('');
}

async function loadHealth() {
  try {
    const h = await (await fetch('/api/health')).json();
    $('status').innerHTML = [
      ['Tavily', h.tavily], ['Token Factory', h.token_factory], ['AI Cloud storage', h.object_storage]
    ].map(([name, on]) =>
      `<span class="pill"><span class="dot ${on ? 'on' : 'off'}"></span>${name}</span>`
    ).join('');
    if (h.missing) showError(`Add ${h.missing} to your .env file, then restart the server.`);
  } catch (e) { /* health is cosmetic */ }

  try {
    const m = await (await fetch('/api/models')).json();
    for (const id of (m.chat_models || [])) {
      $('model').insertAdjacentHTML('beforeend', `<option value="${id}">${id}</option>`);
    }
  } catch (e) { /* dropdown falls back to account default */ }
}

function showError(message) {
  $('error').textContent = message;
  $('error').classList.remove('hidden');
}

async function scout(event) {
  event.preventDefault();
  const query = $('query').value.trim();
  if (!query) return;

  sources = []; raw = '';
  $('go').disabled = true;
  $('error').classList.add('hidden');
  $('results').classList.remove('hidden');
  $('brief').innerHTML = '<span class="cursor"></span>';
  $('sources').innerHTML = '';
  renderPipeline();

  try {
    const response = await fetch('/api/research', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        topic: $('topic').value,
        time_range: $('time_range').value,
        max_results: Number($('max_results').value),
        model: $('model').value
      })
    });

    if (!response.ok) {
      const body = await response.json().catch(() => ({}));
      throw new Error(body.error || `Request failed (${response.status})`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split('\n\n');
      buffer = frames.pop();
      for (const frame of frames) {
        const evt = (frame.match(/^event: (.*)$/m) || [])[1];
        const dataLine = (frame.match(/^data: (.*)$/m) || [])[1];
        if (!evt || !dataLine) continue;
        const data = JSON.parse(dataLine);

        if (evt === 'stage') setStep(data.id, data.status, data.detail);
        else if (evt === 'sources') { sources = data.sources; renderSources(); }
        else if (evt === 'delta') {
          raw += data.text;
          $('brief').innerHTML = renderMarkdown(raw) + '<span class="cursor"></span>';
        } else if (evt === 'done') {
          $('brief').innerHTML = renderMarkdown(raw);
          if (data.archived) {
            $('brief').insertAdjacentHTML('beforeend',
              `<div class="notice">Filed to Nebius AI Cloud Object Storage —
               <a href="${data.archived.url}" target="_blank" rel="noopener">${data.archived.key}</a></div>`);
          }
        } else if (evt === 'error') {
          showError(data.message);
          $('brief').innerHTML = renderMarkdown(raw);
        }
      }
    }
  } catch (err) {
    showError(err.message);
    $('brief').innerHTML = renderMarkdown(raw);
  } finally {
    $('go').disabled = false;
  }
}

$('examples').innerHTML = EXAMPLES.map((e) => `<button type="button" class="chip">${e}</button>`).join('');
$('examples').addEventListener('click', (e) => {
  if (e.target.classList.contains('chip')) { $('query').value = e.target.textContent; $('query').focus(); }
});
$('form').addEventListener('submit', scout);
renderPipeline();
loadHealth();
</script>
</body>
</html>
